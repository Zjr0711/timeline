<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" id="metaTheme" content="#f3f4f8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>时间轴</title>
<script>
/* 离线缓存：注册成功后打开不再依赖网络 */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
<style>
  :root{
    --bg:#f3f4f8; --panel:#ffffff; --ink:#17181d; --sub:#878d9b;
    --grid:#edeff4; --gridStrong:#d9dce6; --line:#e6e8ef;
    --softBg:#eef0f5; --inputBg:#f1f2f7; --chipBg:#f0f1f6;
    --rulerBg:#fafbfd; --grab:#dcdfe8; --dimDay:#c0c4d0; --chkBorder:#c9cdd8;
    --danger:#ff3b30;
    --accent:#4f7cff; --accent2:#7a5cff;
    --rulerW:48px; --headH:54px;
    --shadow:0 6px 22px rgba(23,24,29,.07);
    --btnShadow:0 1px 4px rgba(23,24,29,.05);
  }
  body.dark{
    --bg:#0d0e12; --panel:#191b21; --ink:#f0f1f5; --sub:#8f95a3;
    --grid:#252833; --gridStrong:#303442; --line:#272a34;
    --softBg:#232631; --inputBg:#232631; --chipBg:#232631;
    --rulerBg:#14161c; --grab:#333748; --dimDay:#565c6c; --chkBorder:#3a3f4d;
    --accent:#6f93ff; --accent2:#9a7bff;
    --shadow:0 6px 22px rgba(0,0,0,.5);
    --btnShadow:0 1px 4px rgba(0,0,0,.4);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    background:var(--bg); color:var(--ink);
    height:100%; display:flex; flex-direction:column;
    overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    -webkit-text-size-adjust:100%;
    transition:background .2s ease;
  }
  button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;touch-action:manipulation;}

  /* ---------- header ---------- */
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:4px;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;
    background:var(--bg); z-index:20;
  }
  header .navBtn{
    width:37px;height:37px;border-radius:12px;font-size:20px;line-height:1;
    display:flex;align-items:center;justify-content:center;color:var(--sub);
    background:var(--panel);box-shadow:var(--btnShadow);flex:0 0 auto;
  }
  header .navBtn:active{background:var(--softBg);transform:scale(.94);}
  #dateLabel{
    flex:1;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0;
  }
  #dateMain{font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #dateSub{font-size:10px;color:var(--sub);}

  /* ---------- board ---------- */
  main{flex:1 1 auto; display:flex; min-height:0; padding:6px 12px 0;}
  #board{
    flex:1; display:flex; flex-direction:column; min-height:0; min-width:0;
    background:var(--panel); border-radius:20px; box-shadow:var(--shadow); overflow:hidden;
  }
  #colHead{
    flex:0 0 var(--headH); display:flex; border-bottom:1px solid var(--line);
    background:var(--panel); position:relative; z-index:12;
  }
  #colHead .corner{
    flex:0 0 var(--rulerW); display:flex; align-items:center; justify-content:center;
    font-size:10px; color:var(--dimDay); border-right:1px solid var(--line);
  }
  .colHeadCell{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    border-right:1px solid var(--grid); min-width:0; padding:0 2px;
  }
  .colHeadCell:last-child{border-right:none;}
  .colHeadCell span{font-size:13px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .colHeadCell small{font-size:8.5px;color:var(--dimDay);font-weight:400;}

  #tlWrap{flex:1 1 auto; position:relative; min-height:0;}
  #tl{position:absolute; inset:0; touch-action:none;}

  /* left time ruler */
  #rulerCol{
    position:absolute; top:0; bottom:0; left:0; width:var(--rulerW);
    background:var(--rulerBg); border-right:1px solid var(--line); z-index:10;
  }
  .tickText{
    position:absolute; right:6px; transform:translateY(-50%);
    font-size:10px; color:var(--sub); white-space:nowrap; pointer-events:none;
    font-variant-numeric:tabular-nums;
  }
  .tickText.day{color:var(--ink); font-weight:700;}

  /* columns area */
  #cols{position:absolute; top:0; bottom:0; left:var(--rulerW); right:0;}
  .colSep{position:absolute; top:0; bottom:0; width:1px; background:var(--grid); pointer-events:none; z-index:2;}
  .dayBand{position:absolute; left:0; right:0; background:rgba(23,24,29,.022); pointer-events:none; z-index:0;}
  body.dark .dayBand{background:rgba(255,255,255,.035);}
  .gridLine{position:absolute; left:0; right:0; height:1px; background:var(--grid); pointer-events:none; z-index:1;}
  .gridLine.day{background:var(--gridStrong);}

  /* ---------- task bars ---------- */
  .bar{
    position:absolute; border-radius:12px; z-index:5;
    background:var(--c,#4f7cff);
    box-shadow:0 3px 10px color-mix(in srgb, var(--c,#4f7cff) 32%, transparent);
    transition:box-shadow .16s ease, opacity .2s ease;
  }
  .bar.done{opacity:.45;}
  .bar .barName{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:11.5px; font-weight:650; padding:0 7px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none;
    text-shadow:0 1px 2px rgba(0,0,0,.18);
  }
  .bar .tl-label{
    position:absolute; font-size:9px; font-weight:600; color:rgba(255,255,255,.92);
    white-space:nowrap; pointer-events:none; line-height:1;
    font-variant-numeric:tabular-nums; text-shadow:0 1px 1px rgba(0,0,0,.15);
  }
  .bar .tl-label.s{top:4px; left:7px;}
  .bar .tl-label.e{bottom:4px; right:7px;}
  .bar.short .tl-label{display:none;}
  .bar.tiny .barName{font-size:10px;}
  .bar .h{
    position:absolute; left:0; right:0; height:18px; z-index:6;
    display:flex; align-items:center; justify-content:center;
  }
  .bar .h::before{
    content:""; width:24px; height:4px; border-radius:2px;
    background:rgba(255,255,255,.85); box-shadow:0 0 0 1px rgba(0,0,0,.12);
  }
  .bar .h.t{top:-9px;} .bar .h.b{bottom:-9px;}
  .bar.dragging{z-index:30; box-shadow:0 10px 24px rgba(0,0,0,.28);}
  .bar.pulse{animation:pulse 1s ease-out 2;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(79,124,255,.5);}
    100%{box-shadow:0 0 0 16px rgba(79,124,255,0);}
  }
  .bar.ghost{opacity:.5; border:2px dashed rgba(255,255,255,.95);}

  #ghostHint{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(23,24,29,.88); color:#fff; font-size:12px; padding:8px 14px; border-radius:20px;
    z-index:60; white-space:nowrap; display:none; align-items:center; gap:8px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  #ghostHint button{color:#ffb0b0; font-size:12px; font-weight:600;}

  #emptyHint{
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%);
    text-align:center; z-index:4; pointer-events:none; width:80%;
  }
  #emptyHint .big{font-size:34px; margin-bottom:8px;}
  #emptyHint p{font-size:12.5px; color:var(--sub); line-height:1.7;}
  #emptyHint b{color:var(--ink);}

  #nowLine{
    position:absolute; left:0; right:0; height:2px; z-index:15; pointer-events:none; display:none;
    background:linear-gradient(90deg, var(--danger), rgba(255,59,48,.25));
  }
  #nowLine::before{
    content:"现在"; position:absolute; left:-1px; top:50%; transform:translateY(-50%);
    font-size:9px; color:#fff; background:var(--danger); padding:2px 6px; border-radius:7px;
    font-weight:600; white-space:nowrap; box-shadow:0 2px 6px rgba(255,59,48,.4);
  }

  /* ---------- footer dock ---------- */
  footer{
    flex:0 0 auto; display:flex; gap:9px; align-items:center;
    padding:10px 13px calc(env(safe-area-inset-bottom) + 12px);
    background:var(--bg); z-index:20;
  }
  footer button{
    height:48px; border-radius:16px; font-size:14px; font-weight:600;
    background:var(--panel); color:var(--ink); box-shadow:var(--shadow);
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  footer button:active{transform:scale(.95);}
  #btnAdd{
    flex:1; min-width:0; background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; font-size:14.5px;
    box-shadow:0 8px 20px rgba(79,124,255,.35);
  }
  #btnAdd:active{opacity:.9;}
  #btnTomorrow{padding:0 15px;}
  #btnTomorrow.on{
    background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff;
    box-shadow:0 8px 20px rgba(79,124,255,.35);
  }
  #btnToday{width:48px; padding:0; font-size:19px; color:var(--sub);}
  .zoomBtn{width:48px; padding:0; font-size:20px; color:var(--sub);}

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,11,16,.5); z-index:100;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    width:100%; max-width:520px; background:var(--panel);
    border-radius:24px 24px 0 0; padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);
    max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .sheet::before{
    content:""; display:block; width:38px; height:5px; border-radius:3px;
    background:var(--grab); margin:2px auto 12px;
  }
  .sheet h3{font-size:17px; font-weight:700; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;}
  .sheet h3 .x{
    color:var(--sub); font-size:14px; width:30px; height:30px; border-radius:50%;
    background:var(--chipBg); display:flex; align-items:center; justify-content:center;
  }
  .tabs{display:flex; gap:2px; margin-bottom:16px; background:var(--softBg); border-radius:13px; padding:3px;}
  .tabs button{
    flex:1; height:32px; border-radius:10px; font-size:12px; color:var(--sub); font-weight:600;
  }
  .tabs button.on{background:var(--panel); color:var(--ink); box-shadow:0 2px 8px rgba(23,24,29,.1);}
  .frow{display:flex; gap:10px; margin-bottom:12px;}
  .field{flex:1; display:flex; flex-direction:column; gap:5px; min-width:0;}
  .field label{font-size:11px; color:var(--sub); font-weight:600;}
  .field input{
    height:44px; border:none; border-radius:13px; padding:0 12px;
    font-size:15px; font-family:inherit; background:var(--inputBg); color:var(--ink);
    -webkit-user-select:text; user-select:text; transition:background .15s ease;
  }
  .field input:focus{outline:2px solid var(--accent); background:var(--panel);}
  .primary{
    width:100%; height:48px; border-radius:15px;
    background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff;
    font-size:15px; font-weight:700; margin-top:4px;
    box-shadow:0 6px 16px rgba(79,124,255,.3);
  }
  .primary:active{opacity:.85;}
  .dangerBtn{
    width:100%; height:46px; border-radius:15px; background:#ffecec; color:var(--danger);
    font-size:14px; font-weight:600; margin-top:10px;
  }
  body.dark .dangerBtn{background:rgba(255,59,48,.16); color:#ff7b70;}

  /* detail card */
  #colorRow{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .sw{width:32px; height:32px; border-radius:50%; transition:transform .12s ease;}
  .sw.on{box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--ink); transform:scale(1.05);}
  #lineRow{display:flex; gap:8px; margin-bottom:12px;}
  #lineRow button{
    flex:1; height:38px; border-radius:12px; background:var(--inputBg); font-size:12.5px; font-weight:600; color:var(--sub);
  }
  #lineRow button.on{background:var(--ink); color:var(--panel);}
  #durText{font-size:11px; color:var(--sub); margin:-4px 2px 12px;}

  /* calendar */
  #calHead{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  #calHead b{font-size:17px;}
  #calHead .navBtn{width:36px; height:36px; font-size:18px; color:var(--sub); background:var(--chipBg); border-radius:12px; box-shadow:none;}
  #calGrid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:14px;}
  #calGrid .wd{font-size:10px; color:var(--sub); text-align:center; padding:4px 0; font-weight:600;}
  #calGrid .day{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:13.5px; border-radius:12px; gap:2px; position:relative;
  }
  #calGrid .day.dim{color:var(--dimDay);}
  #calGrid .day.today{font-weight:700; color:var(--danger);}
  #calGrid .day.sel{background:var(--accent); color:#fff; box-shadow:0 4px 10px rgba(79,124,255,.35);}
  #calGrid .day.sel.today{color:#fff;}
  #calGrid .day .dot{width:4px; height:4px; border-radius:50%; background:var(--accent);}
  #calGrid .day.sel .dot{background:#fff;}
  #dayList{border-top:1px solid var(--line); padding-top:12px;}
  #dayList h4{font-size:12px; color:var(--sub); margin-bottom:8px;}
  #dayList .item{
    display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:12px; font-size:13.5px;
  }
  #dayList .item:active{background:var(--softBg);}
  #dayList .item .cd{width:10px; height:10px; border-radius:4px; flex:0 0 auto;}
  #dayList .item .nm{flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #dayList .item .tm{font-size:11px; color:var(--sub); font-variant-numeric:tabular-nums;}
  #dayList .empty{font-size:12px; color:var(--sub); padding:6px;}
  .ioRow{display:flex; gap:10px; margin-top:14px;}
  .ioRow button{
    flex:1; height:40px; border-radius:13px; background:var(--inputBg); font-size:12.5px; font-weight:600; color:var(--sub);
  }

  /* ---------- task list sheet ---------- */
  #listHead{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  #listHead .mid{flex:1; text-align:center; min-width:0;}
  #listHead b{font-size:16.5px; display:block;}
  #listHead small{font-size:10.5px; color:var(--sub); font-weight:400;}
  #listHead .navBtn{width:36px; height:36px; font-size:18px; color:var(--sub); background:var(--chipBg); border-radius:12px; flex:0 0 auto;}
  #listBody{border-top:1px solid var(--line); margin-top:8px;}
  .liRow{display:flex; align-items:flex-start; gap:12px; padding:12px 2px; border-bottom:1px solid var(--grid);}
  .liRow:last-child{border-bottom:none;}
  .chk{
    width:26px; height:26px; border-radius:50%; flex:0 0 auto; margin-top:2px;
    border:2px solid var(--chkBorder); background:transparent;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; color:transparent; line-height:1;
    transition:background .15s ease, border-color .15s ease, transform .12s ease, color .15s ease;
  }
  .chk:active{transform:scale(.88);}
  .chk.done{background:#f5b301; border-color:#f5b301; color:#fff; box-shadow:0 3px 8px rgba(245,179,1,.35);}
  .liTxt{flex:1; min-width:0;}
  .liMeta{display:flex; align-items:center; gap:8px; margin-bottom:2px;}
  .liTime{font-size:12px; color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums;}
  .liLine{
    font-size:9.5px; color:var(--sub); background:var(--chipBg);
    padding:2px 8px; border-radius:8px; font-weight:600; white-space:nowrap;
  }
  .liName{font-size:15px; font-weight:600; line-height:1.4; word-break:break-all;}
  .liRow.done .liName, .liRow.done .liTime{opacity:.4;}
  .liEmpty{padding:26px 6px; text-align:center; font-size:12.5px; color:var(--sub);}
  #listFootHint{font-size:10px; color:var(--dimDay); text-align:center; margin-top:12px;}

  /* ---------- task pool ---------- */
  #listTabs{display:flex; gap:2px; background:var(--softBg); border-radius:13px; padding:3px; margin-bottom:14px;}
  #listTabs button{flex:1; height:32px; border-radius:10px; font-size:12.5px; color:var(--sub); font-weight:600;}
  #listTabs button.on{background:var(--panel); color:var(--ink); box-shadow:0 2px 8px rgba(23,24,29,.1);}
  #poolTabs{display:flex; gap:2px; background:var(--softBg); border-radius:11px; padding:2px; margin-bottom:10px;}
  #poolTabs button{flex:1; height:28px; border-radius:9px; font-size:11.5px; color:var(--sub); font-weight:600;}
  #poolTabs button.on{background:var(--panel); color:var(--ink); box-shadow:0 1px 5px rgba(23,24,29,.08);}
  #poolAddBtn{width:100%; height:40px; border-radius:13px; background:var(--inputBg); color:var(--accent); font-size:13px; font-weight:700; margin-bottom:12px;}
  #poolForm{background:var(--softBg); border-radius:14px; padding:12px; margin-bottom:12px; display:none;}
  #poolForm.show{display:block;}
  .pRow{display:flex; gap:8px; margin-bottom:8px; align-items:flex-end;}
  .pRow .field{margin-bottom:0;}
  .chip{height:36px; padding:0 12px; border-radius:13px; background:var(--chipBg); color:var(--sub); font-size:12px; font-weight:600;}
  .chip:active{background:var(--accent); color:#fff;}
  #poolActive{border-top:1px solid var(--line);}
  .poolItem{display:flex; align-items:center; gap:9px; padding:11px 2px; border-bottom:1px solid var(--grid);}
  .poolItem:last-child{border-bottom:none;}
  .poolItem .pDot{width:9px; height:9px; border-radius:3px; flex:0 0 auto;}
  .poolItem .pName{font-size:14px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .poolItem.done-item .pName{opacity:.4;}
  .poolItem .chk{margin-top:0;}
  .pBadge{font-size:9.5px; font-weight:600; padding:2px 7px; border-radius:8px; background:var(--chipBg); color:var(--sub); white-space:nowrap; flex:0 0 auto;}
  .pBadge.due{background:rgba(245,179,1,.18); color:#b57d00;}
  body.dark .pBadge.due{color:#ffcf4d;}
  .pBadge.overdue{background:rgba(255,59,48,.14); color:var(--danger);}
  .pBadge.ok{background:rgba(49,196,141,.16); color:#1d9d6f;}
  body.dark .pBadge.ok{color:#4ade80;}
  .pBtn{height:28px; padding:0 11px; border-radius:9px; background:var(--inputBg); color:var(--accent); font-size:11px; font-weight:700; flex:0 0 auto;}
  .pBtn.check{color:#1d9d6f;}
  body.dark .pBtn.check{color:#4ade80;}
  .pX{width:26px; height:26px; border-radius:9px; color:var(--dimDay); font-size:13px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
  .poolDoneHead{display:flex; align-items:center; justify-content:space-between; margin:14px 0 2px; border-top:1px solid var(--line); padding-top:12px;}
  .poolDoneHead h4{font-size:11.5px; color:var(--sub); font-weight:600;}
  #poolClear{font-size:11px; color:var(--danger); font-weight:600; padding:4px 8px;}
  #poolEmpty{padding:22px 6px; text-align:center; font-size:12.5px; color:var(--sub); line-height:1.7;}
  #listFootHint2{font-size:10px; color:var(--dimDay); text-align:center; margin-top:12px;}
  #schedOverlay{z-index:120;}
  #schedName{font-size:12px; color:var(--sub); margin:-6px 0 12px;}
  #sLineRow{display:flex; gap:8px; margin-bottom:12px;}
  #sLineRow button{flex:1; height:38px; border-radius:12px; background:var(--inputBg); font-size:12.5px; font-weight:600; color:var(--sub);}
  #sLineRow button.on{background:var(--ink); color:var(--panel);}

  /* toast */
  #toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 92px); transform:translateX(-50%);
    background:rgba(23,24,29,.9); color:#fff; font-size:13px; padding:11px 20px; border-radius:22px;
    z-index:300; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; max-width:90vw;
    overflow:hidden; text-overflow:ellipsis;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  body.dark #toast{background:rgba(60,64,78,.95);}
  #toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <button class="navBtn" id="prevDay" aria-label="前一天">‹</button>
  <div id="dateLabel"><span id="dateMain">—</span><small id="dateSub"></small></div>
  <button class="navBtn" id="nextDay" aria-label="后一天">›</button>

<script>
"use strict";
/* ================= constants & state ================= */
var MIN = 60000;
var PALETTE = ['#4f7cff','#31c48d','#f43f5e','#0ea5e9','#f59e0b','#a855f7','#ec4899','#14b8a6','#64748b'];
var RULER_W = 48;
var HOUR_PER_SCR_MAX = 1, HOUR_PER_SCR_MIN = 168; /* 1 hour .. 7 days per screen */

var store = {
  v: 1,
  lines: [{name:'Line1'},{name:'Line2'},{name:'Line3'}],
  tasks: [],   /* {id,name,line,start,end,color,done} start/end = ms epoch */
  pool: [],    /* {id,type:'once'|'long',name,color,done,
                   once: due(ms,0=无日期)
                   long: totalDays(0=不限), checkins:[ms...]} */
  seq: 1
};
var view = { center: Date.now(), pxPerHour: 110 };
var tlH = 600;                      /* timeline area height in px */
var colW = 100;                     /* column width in px */
var barEls = {};                    /* id -> element */
var ghost = null;                   /* {name,dur,color,line,start} */
var gesture = null;
var planTomorrow = false;

/* ================= utils ================= */
function $(id){ return document.getElementById(id); }
function pad(n){ return (n<10?'0':'')+n; }
function fmtHM(t){ var d=new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtMD(t){ var d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate(); }
function fmtDate(t){ var d=new Date(t); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
function weekCN(t){ return '周'+'日一二三四五六'[new Date(t).getDay()]; }
function dayKey(t){ var d=new Date(t); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function dayStart(t){ var d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function tomorrowNoon(){ var d=new Date(); d.setDate(d.getDate()+1); d.setHours(12,0,0,0); return d.getTime(); }
function snapMin(t){ return Math.round(t/MIN)*MIN; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function toDateInput(ms){ var d=new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function toTimeInput(ms){ var d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fromDateTime(dateStr,timeStr){
  var p=dateStr.split('-'), q=timeStr.split(':');
  return new Date(+p[0],+p[1]-1,+p[2],+(q[0]||0),+(q[1]||0),0,0).getTime();
}
var toastTimer=null;
function toast(msg){
  var el=$('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){el.classList.remove('show');},2200);
}
function overlaps(aS,aE,bS,bE){ return aS < bE && aE > bS; }
function taskOverlapOnLine(line,s,e,excludeId){
  for(var i=0;i<store.tasks.length;i++){
    var t=store.tasks[i];
    if(t.line===line && t.id!==excludeId && overlaps(s,e,t.start,t.end)) return t;
  }
  return null;
}
/* nearest valid start on a column for [s, s+dur], or null */
function clampPlacement(line,s,dur,excludeId){
  var busy=[];
  for(var i=0;i<store.tasks.length;i++){
    var t=store.tasks[i];
    if(t.line===line && t.id!==excludeId) busy.push([t.start,t.end]);
  }
  busy.sort(function(a,b){return a[0]-b[0];});
  for(var k=0;k<80;k++){
    var hit=null;
    for(var j=0;j<busy.length;j++){
      if(s < busy[j][1] && s+dur > busy[j][0]){ hit=busy[j]; break; }
    }
    if(!hit) return s;
    var left=hit[0]-dur, right=hit[1];
    s = (left>-Infinity && Math.abs(left-s)<=Math.abs(right-s)) ? left : right;
  }
  return null;
}
/* find column+start nearest to preferred for a new task */
function findPlacement(prefLine,s,dur){
  var order=[prefLine,0,1,2].filter(function(v,i,a){return a.indexOf(v)===i;});
  var best=null;
  for(var i=0;i<order.length;i++){
    var c=clampPlacement(order[i],s,dur,-1);
    if(c===null) continue;
    if(c===s) return {line:order[i],start:c};
    if(best===null || Math.abs(c-s)<Math.abs(best.start-s)) best={line:order[i],start:c};
  }
  return best;
}

/* ================= persistence ================= */
var LS_KEY='timeline3lines.v1';
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }
  catch(e){ toast('保存失败：存储空间不足'); }
}
function load(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(!raw) return;
    var d=JSON.parse(raw);
    if(d && d.v===1 && Array.isArray(d.tasks)){
      store.lines=d.lines||store.lines;
      store.tasks=d.tasks;
      store.pool=Array.isArray(d.pool)?d.pool:[];
      store.seq=d.seq||store.tasks.length+1;
      refreshLineLabels();
    }
  }catch(e){}
}

/* ================= theme ================= */
var THEME_KEY='timeline-theme.v1';
function applyTheme(th, persist){
  var dark = th==='dark';
  document.body.classList.toggle('dark', dark);
  $('btnTheme').textContent = dark ? '☀️' : '🌙';
  $('metaTheme').setAttribute('content', dark ? '#0d0e12' : '#f3f4f8');
  if(persist){ try{ localStorage.setItem(THEME_KEY, dark?'dark':'light'); }catch(e){} }
}
(function initTheme(){
  var saved=null;
  try{ saved=localStorage.getItem(THEME_KEY); }catch(e){}
  if(!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) saved='dark';
  applyTheme(saved==='dark'?'dark':'light', false);
})();
$('btnTheme').addEventListener('click',function(){
  applyTheme(document.body.classList.contains('dark')?'light':'dark', true);
});

/* ================= view transform (vertical) =================
   time flows top -> bottom; 3 fixed vertical columns */
function pxPerMs(){ return view.pxPerHour/3600000; }
function yOf(t){ return (t-view.center)*pxPerMs() + tlH/2; }
function tOf(y){ return view.center + (y-tlH/2)/pxPerMs(); }
function timelineHeight(){
  return Math.max(tlH || ($('tl') && $('tl').clientHeight) || window.innerHeight-220, 100);
}
function zoomBounds(){
  var h=timelineHeight();
  return [ h/(HOUR_PER_SCR_MIN*3600000)*3600000, h/(HOUR_PER_SCR_MAX*3600000)*3600000 ];
}
function clampZoom(){
  var b=zoomBounds();
  view.pxPerHour = clamp(view.pxPerHour, b[0], b[1]);
}
function zoomAt(factor, anchorY){
  var ay=(anchorY===undefined? tlH/2 : anchorY);
  var anchorT=tOf(ay);
  var b=zoomBounds();
  view.pxPerHour=clamp(view.pxPerHour*factor, b[0], b[1]);
  view.center = anchorT - (ay-tlH/2)/pxPerMs();
  render();
}

/* ================= render ================= */
function render(){
  tlH = $('tl').clientHeight || tlH;
  colW = Math.max(($('tl').clientWidth - RULER_W)/3, 40);
  clampZoom();
  renderHeader();
  renderRuler();
  renderBars();
  renderNow();
  $('emptyHint').style.display = (store.tasks.length===0 && !ghost) ? 'block' : 'none';
}

function renderHeader(){
  $('dateMain').textContent = fmtDate(view.center)+' '+weekCN(view.center);
  var dayTasks=store.tasks.filter(function(t){ return dayKey(t.start)===dayKey(view.center); });
  $('dateSub').textContent = dayTasks.length ? '当天 '+dayTasks.length+' 个任务 · 点此打开日历' : '点日期打开日历';
}

function pickStep(){
  var stepsMin=[1,5,10,15,30,60,120,180,360,720,1440];
  for(var i=0;i<stepsMin.length;i++){
    if(stepsMin[i]*view.pxPerHour/60 >= 64) return stepsMin[i];
  }
  return 1440;
}
function renderRuler(){
  var ruler=$('rulerCol'), grid=$('grid'), bands=$('bands');
  ruler.innerHTML=''; grid.innerHTML=''; bands.innerHTML='';
  var stepMin=pickStep(), stepMs=stepMin*MIN;
  var t0=tOf(0), t1=tOf(tlH);
  /* weekend bands (full day tint) */
  var d=new Date(t0); d.setHours(0,0,0,0);
  while(d.getTime()<=t1){
    var ds=d.getTime(), de=ds+86400000;
    var wd=d.getDay();
    if(wd===0||wd===6){
      var bs=Math.max(ds,t0), be=Math.min(de,t1);
      if(be>bs){
        var band=document.createElement('div');
        band.className='dayBand';
        band.style.top=yOf(bs)+'px';
        band.style.height=(yOf(be)-yOf(bs))+'px';
        bands.appendChild(band);
      }
    }
    d.setDate(d.getDate()+1);
  }
  /* time ticks */
  var t=Math.ceil(t0/stepMs)*stepMs;
  while(t<=t1){
    var y=yOf(t);
    var d2=new Date(t);
    var isMid = d2.getHours()===0 && d2.getMinutes()===0;
    var isDay = stepMin>=1440 || isMid;
    var lb=document.createElement('div');
    lb.className='tickText'+(isDay?' day':'');
    lb.style.top=y+'px';
    lb.textContent = isDay ? fmtMD(t) : fmtHM(t);
    ruler.appendChild(lb);
    if(stepMin<1440){
      var gl=document.createElement('div');
      gl.className='gridLine'+(isDay?' day':'');
      gl.style.top=y+'px';
      grid.appendChild(gl);
    }
    t+=stepMs;
  }
}

function barHTML(){
  return '<div class="tl-label s"></div><div class="barName"></div>'+
         '<div class="h t"></div><div class="h b"></div><div class="tl-label e"></div>';
}
function styleBar(el, taskLike){
  var sy=yOf(taskLike.start), ey=yOf(taskLike.start+taskLike.dur);
  var h=Math.max(ey-sy,8);
  el.style.setProperty('--c',taskLike.color);
  el.style.left=(taskLike.line*colW+5)+'px';
  el.style.width=(colW-10)+'px';
  el.style.top=sy+'px';
  el.style.height=h+'px';
  el.classList.toggle('short', h<44);
  el.classList.toggle('tiny', h<26);
  el.querySelector('.tl-label.s').textContent=fmtHM(taskLike.start);
  el.querySelector('.tl-label.e').textContent=fmtHM(taskLike.start+taskLike.dur);
  el.querySelector('.barName').textContent=taskLike.name;
}

function renderBars(){
  var cols=$('cols');
  var t0=tOf(-60), t1=tOf(tlH+60);
  var seen={};
  for(var k=0;k<store.tasks.length;k++){
    var task=store.tasks[k];
    if(!(task.end>t0 && task.start<t1)){
      if(barEls[task.id]){ barEls[task.id].remove(); delete barEls[task.id]; }
      continue;
    }
    seen[task.id]=true;
    var el=barEls[task.id];
    if(!el){
      el=document.createElement('div');
      el.className='bar';
      el.innerHTML=barHTML();
      cols.appendChild(el);
      barEls[task.id]=el;
    }
    styleBar(el,{start:task.start,dur:task.end-task.start,line:task.line,color:task.color,name:task.name});
    el.classList.toggle('done', !!task.done);
    el.style.display='';
  }
  for(var id in barEls){ if(!seen[id]){ barEls[id].remove(); delete barEls[id]; } }
  renderGhost(cols);
}

function renderGhost(cols){
  var g=$('ghostBar');
  if(!ghost){ if(g) g.remove(); return; }
  if(!g){
    g=document.createElement('div');
    g.id='ghostBar'; g.className='bar ghost';
    g.innerHTML=barHTML();
    cols.appendChild(g);
  }
  styleBar(g,ghost);
  g.style.display='';
}

function renderNow(){
  var now=Date.now(), y=yOf(now);
  var nl=$('nowLine');
  if(y<-40||y>tlH+40){ nl.style.display='none'; return; }
  nl.style.display='block'; nl.style.top=y+'px';
}

/* ================= gestures ================= */
function localXY(touch){
  var r=$('tl').getBoundingClientRect();
  return {x:touch.clientX-r.left, y:touch.clientY-r.top};
}
function colFromX(x){
  return clamp(Math.floor((x-RULER_W)/colW),0,2);
}
function hitTest(x,y){
  var cx=x-RULER_W;
  if(cx<-10||cx>colW*3+10) return null;
  var col=colFromX(x);
  var best=null;
  for(var i=store.tasks.length-1;i>=0;i--){
    var t=store.tasks[i];
    if(t.line!==col) continue;
    var sy=yOf(t.start), ey=yOf(t.end);
    if(y>=sy-9 && y<=ey+9){
      var kind='body';
      if(ey-sy>44){
        if(y<sy+22) kind='t';
        else if(y>ey-22) kind='b';
      }
      best={task:t,kind:kind};
      break;
    }
  }
  if(!best && ghost){
    if(ghost.line===col){
      var gsy=yOf(ghost.start), gey=yOf(ghost.start+ghost.dur);
      if(y>=gsy-9 && y<=gey+9) best={ghost:true,kind:'body'};
    }
  }
  return best;
}

var tl=$('tl');
function tsStart(e){
  if(e.touches.length===2){
    var a=localXY(e.touches[0]), b=localXY(e.touches[1]);
    var fy=(a.y+b.y)/2;
    gesture={type:'pinch',d0:Math.max(Math.abs(b.y-a.y),1),pph0:view.pxPerHour,fy:fy,ft:tOf(fy)};
    return;
  }
  var p=localXY(e.touches[0]);
  var hit=hitTest(p.x,p.y);
  if(ghost){
    gesture={type:'bar',isGhost:true,moved:false,x0:p.x,y0:p.y};
    return;
  }
  if(hit){
    var t=hit.task;
    gesture={type:hit.kind==='body'?'bar':'handle',side:hit.kind,task:t,
             moved:false,x0:p.x,y0:p.y,
             s0:t.start,e0:t.end,line0:t.line};
  }else{
    gesture={type:'pan',moved:false,y0:p.y,c0:view.center};
  }
}
function tsMove(e){
  if(!gesture) return;
  e.preventDefault();
  if(gesture.type==='pinch'){
    if(e.touches.length<2) return;
    var a=localXY(e.touches[0]), b=localXY(e.touches[1]);
    var d=Math.max(Math.abs(b.y-a.y),1);
    var bnd=zoomBounds();
    view.pxPerHour=clamp(gesture.pph0*d/gesture.d0, bnd[0], bnd[1]);
    view.center=gesture.ft-(gesture.fy-tlH/2)/pxPerMs();
    render();
    return;
  }
  var p=localXY(e.touches[0]);
  var dy=p.y-gesture.y0;
  if(Math.abs(dy)>5||Math.abs(p.x-gesture.x0)>5) gesture.moved=true;
  if(gesture.type==='pan'){
    view.center=gesture.c0-dy/pxPerMs();
    render();
    return;
  }
  if(gesture.type==='bar'){
    var dt=dy/pxPerMs();
    var isG=gesture.isGhost;
    var s0=isG?ghost.start:gesture.s0, dur=(isG?ghost.dur:gesture.e0-gesture.s0);
    var desired=snapMin(s0+dt);
    var col=colFromX(p.x);
    var s2=clampPlacement(col,desired,dur,isG?-1:gesture.task.id);
    if(s2===null){ s2=snapMin(s0); col=isG?ghost.line:gesture.task.line; s2=clampPlacement(col,s2,dur,isG?-1:gesture.task.id)||s2; }
    if(isG){ ghost.start=s2; ghost.line=col; }
    else { gesture.task.start=s2; gesture.task.end=s2+dur; gesture.task.line=col; }
    render();
    return;
  }
  if(gesture.type==='handle'){
    var dt2=dy/pxPerMs();
    var t=gesture.task;
    if(gesture.side==='t'){
      var ns=clamp(snapMin(gesture.s0+dt2), gesture.e0-MIN*720, gesture.e0-MIN);
      ns=clampPlacement(t.line,ns,gesture.e0-ns,t.id);
      if(ns!==null){ t.start=ns; }
    }else{
      var ne=clamp(snapMin(gesture.e0+dt2), gesture.s0+MIN, gesture.s0+MIN*720);
      var hit2=taskOverlapOnLine(t.line,gesture.s0,ne,t.id);
      if(hit2){ ne=hit2.start; }
      t.end=Math.max(ne,gesture.s0+MIN);
    }
    render();
    return;
  }
}
function tsEnd(e){
  if(!gesture) return;
  var g=gesture;
  if(g.type==='pinch'){ gesture=null; return; }
  if(!g.moved && (g.type==='bar') && !g.isGhost){
    openDetail(g.task);
  }
  if(g.type==='bar'||g.type==='handle'){
    if(g.type==='bar'&&!g.isGhost){ checkNoOverlap(g.task); }
    save();
    if(g.isGhost) finalizeGhost();
  }
  gesture=null;
}
function checkNoOverlap(t){
  var hit=taskOverlapOnLine(t.line,t.start,t.end,t.id);
  if(hit){
    toast('与「'+hit.name+'」时间重叠，已回退');
  }
}
tl.addEventListener('touchstart',tsStart,{passive:false});
tl.addEventListener('touchmove',tsMove,{passive:false});
tl.addEventListener('touchend',tsEnd);
tl.addEventListener('touchcancel',function(){gesture=null;});

/* desktop mouse fallback */
var mdown=false;
tl.addEventListener('mousedown',function(e){
  var fake={touches:[{clientX:e.clientX,clientY:e.clientY}],preventDefault:function(){}};
  tsStart(fake); mdown=true;
});
window.addEventListener('mousemove',function(e){
  if(!mdown||!gesture) return;
  var fake={touches:[{clientX:e.clientX,clientY:e.clientY}],preventDefault:function(){}};
  tsMove(fake);
});
window.addEventListener('mouseup',function(){ if(mdown){ mdown=false; tsEnd({}); } });
tl.addEventListener('wheel',function(e){
  e.preventDefault();
  var r=tl.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey){
    zoomAt(e.deltaY<0?1.18:1/1.18, e.clientY-r.top);
  }else{
    view.center+= e.deltaY/pxPerMs(); render();
  }
},{passive:false});

  toast('已添加：'+name+' '+fmtHM(start)+'–'+fmtHM(end));

/* ================= task pool logic ================= */
function poolBadge(item){
  if(item.type==='once'){
    if(!item.due) return '';
    var diff=Math.round((dayStart(item.due)-dayStart(Date.now()))/86400000);
    if(diff===0) return '<span class="pBadge due">今天</span>';
    if(diff===1) return '<span class="pBadge">明天</span>';
    if(diff<0) return '<span class="pBadge overdue">逾期'+(-diff)+'天</span>';
    return '<span class="pBadge">'+fmtMD(item.due)+'</span>';
  }
  var n=item.checkins.length;
  if(item.totalDays) return '<span class="pBadge'+(n>=item.totalDays?' ok':'')+'">'+n+'/'+item.totalDays+' 天</span>';
  return '<span class="pBadge">打卡 '+n+' 次</span>';
}
function poolRow(item, doneSection){
  var controls;
  if(doneSection){
    controls='<button class="pX" data-act="del">✕</button>';
  }else{
    controls=(item.type==='long'
        ? '<button class="pBtn check" data-act="checkin">打卡</button><button class="pBtn" data-act="sched">安排</button>'
        : '<button class="pBtn" data-act="sched">安排</button>')
      +'<button class="chk'+(item.done?' done':'')+'" data-act="toggle">✓</button>'
      +'<button class="pX" data-act="del">✕</button>';
  }
  return '<div class="poolItem'+(item.done?' done-item':'')+'" data-id="'+item.id+'">'+
    '<span class="pDot" style="background:'+item.color+'"></span>'+
    '<span class="pName">'+escHTML(item.name)+'</span>'+
    poolBadge(item)+controls+'</div>';
}
function bindPoolEvents(box){
  box.querySelectorAll('.poolItem').forEach(function(row){
    var item=store.pool.find(function(p){return p.id===+row.dataset.id;});
    if(!item) return;
    row.querySelectorAll('[data-act]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var act=btn.dataset.act;
        if(act==='toggle'){
          item.done=!item.done; save(); renderPool();
        }else if(act==='del'){
          if(confirm('从池子删除「'+item.name+'」？')){
            store.pool=store.pool.filter(function(p){return p!==item;});
            save(); renderPool();
          }
        }else if(act==='checkin'){
          item.checkins.push(Date.now()); save(); renderPool();
          toast('已打卡 '+item.checkins.length+(item.totalDays?'/'+item.totalDays:'')+' 次');
        }else if(act==='sched'){
          openSched(item);
        }
      });
    });
  });
}
function renderPool(){
  $('pOnceFields').style.display = poolTab==='once' ? 'flex' : 'none';
  $('pLongFields').style.display = poolTab==='long' ? 'flex' : 'none';
  document.querySelectorAll('#poolTabs button').forEach(function(b){
    b.classList.toggle('on', b.dataset.ptab===poolTab);
  });
  var act=store.pool.filter(function(p){return p.type===poolTab && !p.done;});
  var done=store.pool.filter(function(p){return p.type===poolTab && p.done;});
  if(poolTab==='once'){
    act.sort(function(a,b){ return (a.due||Infinity)-(b.due||Infinity); });
  }
  $('poolActive').innerHTML = act.map(function(p){return poolRow(p,false);}).join('');
  var emptyShown = !act.length && !done.length;
  $('poolEmpty').style.display = emptyShown ? 'block' : 'none';
  $('poolDoneWrap').style.display = done.length ? 'block' : 'none';
  $('poolDoneN').textContent = done.length;
  $('poolDone').innerHTML = done.map(function(p){return poolRow(p,true);}).join('');
  bindPoolEvents($('poolActive'));
  bindPoolEvents($('poolDone'));
}

/* ================= line rename ================= */
var lpTimer=null;
document.querySelectorAll('.colHeadCell').forEach(function(lb){
  var line=+lb.dataset.line;
  lb.addEventListener('touchstart',function(){
    lpTimer=setTimeout(function(){ renameLine(line); },550);
  },{passive:true});
  lb.addEventListener('touchend',function(){ clearTimeout(lpTimer); });
  lb.addEventListener('touchmove',function(){ clearTimeout(lpTimer); });
  lb.addEventListener('contextmenu',function(e){ e.preventDefault(); renameLine(line); });
  lb.addEventListener('dblclick',function(){ renameLine(line); });
});
function renameLine(i){
  var name=prompt('给这条线起个名字（留空恢复 Line'+(i+1)+'）：',store.lines[i].name);
  if(name===null) return;
  store.lines[i].name=name.trim()||('Line'+(i+1));
  save(); refreshLineLabels();
}
function refreshLineLabels(){
  document.querySelectorAll('.colHeadCell').forEach(function(lb){
    var i=+lb.dataset.line;
    lb.querySelector('span').textContent=store.lines[i].name;
  });
}

/* ================= calendar ================= */
var calY, calM, calSel;
function openCal(){
  var d=new Date();
  calY=d.getFullYear(); calM=d.getMonth(); calSel=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  $('calOverlay').classList.add('show');
  renderCal();
}
$('btnCal').addEventListener('click',openCal);
$('dateLabel').addEventListener('click',openCal);
$('calPrev').addEventListener('click',function(){ calM--; if(calM<0){calM=11;calY--;} renderCal(); });
$('calNext').addEventListener('click',function(){ calM++; if(calM>11){calM=0;calY++;} renderCal(); });
function renderCal(){
  $('calTitle').textContent=calY+'年'+(calM+1)+'月';
  var grid=$('calGrid'); grid.innerHTML='';
  ['日','一','二','三','四','五','六'].forEach(function(w){
    var d=document.createElement('div'); d.className='wd'; d.textContent=w; grid.appendChild(d);
  });
  var first=new Date(calY,calM,1).getDay();
  var dim=new Date(calY,calM+1,0).getDate();
  var prevDim=new Date(calY,calM,0).getDate();
  var todayKey=dayKey(Date.now());
  for(var i=0;i<42;i++){
    var dayNum, dt, cls='day', inMonth=true;
    if(i<first){ dayNum=prevDim-first+1+i; dt=new Date(calY,calM-1,dayNum); inMonth=false; }
    else if(i>=first+dim){ dayNum=i-first-dim+1; dt=new Date(calY,calM+1,dayNum); inMonth=false; }
    else { dayNum=i-first+1; dt=new Date(calY,calM,dayNum); }
    if(!inMonth) cls+=' dim';
    var kt=dt.getTime();
    if(dayKey(kt)===todayKey) cls+=' today';
    if(kt===calSel) cls+=' sel';
    var cell=document.createElement('div');
    cell.className=cls;
    var hasTask=store.tasks.some(function(t){return dayKey(t.start)===dayKey(kt);});
    cell.innerHTML='<span>'+dayNum+'</span>'+(hasTask?'<span class="dot"></span>':'');
    (function(kt2){
      cell.addEventListener('click',function(){ calSel=kt2; renderCal(); jumpToDay(kt2); });
    })(kt);
    grid.appendChild(cell);
  }
  renderDayList();
}
function renderDayList(){
  var box=$('dayList');
  var list=store.tasks.filter(function(t){return dayKey(t.start)===dayKey(calSel);})
    .sort(function(a,b){return a.start-b.start;});
  var h='<h4>'+fmtDate(calSel)+' '+weekCN(calSel)+' 的任务（'+list.length+'）</h4>';
  if(!list.length) h+='<div class="empty">这一天还没有任务，点击任务可跳转定位</div>';
  list.forEach(function(t){
    h+='<div class="item" data-id="'+t.id+'"><span class="cd" style="background:'+t.color+'"></span>'+
       '<span class="nm">'+escHTML(t.name)+'</span><span class="tm">'+fmtHM(t.start)+'–'+fmtHM(t.end)+'</span></div>';
  });
  box.innerHTML=h;
  box.querySelectorAll('.item').forEach(function(it){
    it.addEventListener('click',function(){
      var t=store.tasks.find(function(q){return q.id==it.dataset.id;});
      if(!t) return;
      $('calOverlay').classList.remove('show');
      view.center=t.start; render();
      var el=barEls[t.id];
      if(el){ el.classList.add('pulse'); setTimeout(function(){el.classList.remove('pulse');},2100); }
    });
  });
}
function jumpToDay(ms){
  view.center=new Date(ms).setHours(12,0,0,0);
  render();
}
function escHTML(s){ return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

/* ================= export / import ================= */
$('btnExport').addEventListener('click',function(){
  var blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='timeline-backup-'+toDateInput(Date.now()).replace(/-/g,'')+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast('已导出备份文件');
});
$('btnImport').addEventListener('click',function(){ $('importFile').click(); });
$('importFile').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||d.v!==1||!Array.isArray(d.tasks)) throw 0;
      if(!confirm('导入将覆盖当前全部数据（'+d.tasks.length+' 个任务），继续？')) return;
      store=d; store.pool=Array.isArray(d.pool)?d.pool:[]; save(); refreshLineLabels(); render(); renderCal();
      toast('导入成功');
    }catch(err){ toast('文件格式不正确'); }
  };
  r.readAsText(f);
  e.target.value='';
});

/* ================= nav buttons ================= */
$('prevDay').addEventListener('click',function(){ view.center-=24*3600000; render(); });
$('nextDay').addEventListener('click',function(){ view.center+=24*3600000; render(); });
$('zoomIn').addEventListener('click',function(){ zoomAt(1.6); });
$('zoomOut').addEventListener('click',function(){ zoomAt(1/1.6); });
document.querySelectorAll('[data-close]').forEach(function(b){
  b.addEventListener('click',function(){ $(b.dataset.close).classList.remove('show'); });
});
document.querySelectorAll('.overlay').forEach(function(o){
  o.addEventListener('click',function(e){ if(e.target===o) o.classList.remove('show'); });
});

/* ================= boot ================= */
window.addEventListener('resize',function(){ render(); });
window.addEventListener('orientationchange',function(){ setTimeout(function(){ render(); },120); });
document.addEventListener('gesturestart',function(e){ e.preventDefault(); }); /* iOS page zoom */
load();
render();
setInterval(function(){ renderNow(); renderHeader(); },30000);
</script>
